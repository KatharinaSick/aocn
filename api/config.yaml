# Local stand-ins for missing secrets. Set only by `devbox run api`; refused on Cloud
# Run. Without it, the API does not start unless every secret below is set.
dev: ${AOCN_DEV}

server:
  # Cloud Run injects PORT and expects the service to listen on it. Empty locally,
  # where app.ParseConfig falls back to 8080.
  port: ${PORT}

# When each door opens, shared with the website. Relative to the working directory: api/
# locally, so the file at the repository root; /app in the container, which copies it
# to /schedule.yaml.
schedule:
  path: ../schedule.yaml

# Where the challenges repository uploaded each door's bundle and page. Set one of the two.
doors:
  # The bucket on Cloud Run, set by infra/.
  bucket: ${DOORS_BUCKET}
  # A folder laid out like the bucket, locally. `devbox run api` points it at build/ in a
  # checkout of the challenges repository next to this one, which `make bundle` fills.
  dir: ${DOORS_DIR}

site:
  # Where links in emails point, and where GitHub sends people back after logging in. Empty
  # falls back to https://aocn.dev; `devbox run api` sets http://localhost:4321.
  url: ${SITE_URL}

database:
  # From Secret Manager on Cloud Run (Neon). `devbox run api` sets it to the local
  # Postgres from `devbox services up`.
  url: ${DATABASE_URL}

resend:
  # Keep empty to log emails instead of sending them.
  apiKey: ${RESEND_API_KEY}
  # The name says where the email comes from; POLARIS-7 speaks in the text. Mail apps
  # cut names off after about 20 characters, so there is no room for both.
  fromAddress: Advent of Cloud Native <noreply@aocn.dev>
  segmentId: 27aa930d-002c-4773-be29-d99460833e6a

subscribe:
  # Signs the link in the confirmation email.
  signingKey: ${SUBSCRIBE_SIGNING_KEY}

# The GitHub OAuth app people log in to the website with. The CLI uses the same app, with the
# device flow. The client ID is public; Cloud Run gets it from infra/, the secret from Secret
# Manager. Its one callback URL is https://aocn.dev/api/auth/github/callback, so logging in
# locally needs a second OAuth app with http://localhost:4321/api/auth/github/callback; set
# both variables for `devbox run api` (see README.md). Without them, dev mode has no login.
github:
  clientId: ${GITHUB_CLIENT_ID}
  clientSecret: ${GITHUB_CLIENT_SECRET}

session:
  # Signs the session cookie of whoever logged in on the website. Rotating it logs everyone
  # out. In dev mode a random one is used when it's empty.
  signingKey: ${SESSION_SIGNING_KEY}

# Who gets which doors early, to test and review them: GitHub user IDs with all their doors or
# some, separated by spaces, like "9420018:all 7654321:1 1111111:3,5". From Secret Manager on
# Cloud Run (filled in by hand, see infra/README.md), so who playtests isn't in this
# repository. Look an ID up with: gh api users/<login> --jq .id
# Quoted, so a value over several lines reads as one.
previewers: "${PREVIEWERS}"
