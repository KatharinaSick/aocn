  <defs>
    <linearGradient id="skyBg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1000">
      <stop offset="0" stop-color="#050912"/>
      <stop offset="0.42" stop-color="#07101a"/>
      <stop offset="0.72" stop-color="#0a1114"/>
    </linearGradient>
    <linearGradient id="skyCurtainA" gradientUnits="userSpaceOnUse" x1="1000" y1="318" x2="1053" y2="133">
      <stop offset="0" stop-color="#5CE6A8" stop-opacity="0"/>
      <stop offset="0.08" stop-color="#7DF5C0" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="#3FD3B0" stop-opacity="0.7"/>
      <stop offset="0.65" stop-color="#6C7CF0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#A99BFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="skyCurtainB" gradientUnits="userSpaceOnUse" x1="1300" y1="202" x2="1348" y2="30">
      <stop offset="0" stop-color="#A99BFF" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#9C8CFF" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#7A5CE0" stop-opacity="0.4"/>
